<!DOCTYPE html>
<html>
<head>
  <title>Coleweight to Polinex Converter</title>
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background-color: #242424;
      color: white;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    h1 {
      text-align: center;
      color: #4CAF50;
      margin-bottom: 30px;
    }
    h3 { 
      margin-top: 0;
      color: #81C784;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 15px 0;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #45a049;
    }
    textarea {
      width: 100%;
      height: 200px;
      background-color: #333;
      color: white;
      padding: 15px;
      font-family: monospace;
      resize: vertical;
      border: 1px solid #555;
      border-radius: 5px;
      box-sizing: border-box;
    }
    .converter-container { 
      display: flex; 
      flex-direction: column;
      gap: 30px;
    }
    .converter-section { 
      background-color: #2a2a2a;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #444;
    }
  </style>
</head>
<body>
  <h1>Coleweight to Polinex Waypoint Converter</h1>
  


  <div class="converter-container">
    <div class="converter-section">
      <h3>Convert Coleweight waypoints to Polinex format</h3>
      <label for="inputColeweight">Coleweight Waypoints (JSON):</label>
      <textarea id="inputColeweight" placeholder="Paste your Coleweight waypoints JSON here..."></textarea>
      
      <button onclick="convertToPolinex()">Convert to Polinex</button>
      
      <label for="outputPolinex">Polinex Waypoints (JSON):</label>
      <textarea id="outputPolinex" readonly placeholder="Converted Polinex waypoints will appear here..."></textarea>
    </div>
  </div>

  <script>
    function convertToPolinex() {
      try {
        let inputData = JSON.parse(document.getElementById("inputColeweight").value);
        let outputData = [];
        
        for (let waypoint of inputData) {
          outputData.push({
            x: waypoint.x,
            y: waypoint.y,
            z: waypoint.z,
            moveType: "WARP"
          });
        }
        
        document.getElementById("outputPolinex").value = JSON.stringify(outputData, null, 2);
      } catch (error) {
        alert("Error parsing JSON: " + error.message + "\n\nPlease check that your input is valid JSON format.");
      }
    }

    // Auto-focus on input textarea
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById("inputColeweight").focus();
    });
  </script>
</body>
</html>
